[package]
name = "lrclib"
version = "0.1.0"
edition = "2024"

[dependencies]
# 0.12 (not 0.13) to match the version ytmusicapi already pulls in — 0.13 would
# add a second HTTP stack plus an aws-lc-sys C build. Note there is no "query"
# feature on 0.12; `.query()` is unconditional there.
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
# Per-record deserialisation, so one malformed row can't fail a whole response.
serde_json = "1"
log = "0.4"
thiserror = "1"

[dev-dependencies]
# Only the tests need a runtime — the library itself never touches tokio.
tokio = { version = "1", features = ["rt", "macros", "time"] }
