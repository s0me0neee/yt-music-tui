[package]
name = "ytm-core"
version = "0.1.0"
edition = "2024"

[dependencies]
lrclib = { path = "../lrclib" }
ytmusicapi = "0.5.0"
libmpv2 = "6.0.0"
# Lyric translation calls translate_a/single directly through this, because the
# reply has to be read segment by segment — see `translate.rs`. 0.12 to match
# the version `lrclib` and `ytmusicapi` already pull in; a second stack would
# add an aws-lc-sys C build. Verify with `cargo tree -i aws-lc-sys` (*not
# found*). No "json" feature: the reply is a positional array, not an object,
# so it is parsed with serde_json directly.
reqwest = { version = "0.13.4", features = ["gzip"] }
# Kept only for `supported_languages`, which `normalise_language` checks
# `lyrics.translate-to` against. Its `translate` function is unused: it reads
# just the first segment of a reply and silently drops the rest.
rust-translate = "0.1.3"
# "sync" is not needed: concurrency in `translate.rs` is bounded by spawning in
# rounds rather than with a semaphore.
tokio = { version = "1.53.1", features = ["rt", "time"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# config.toml parsing. Read-only, so no "display" feature — but "serde" is
# needed even though nothing here derives `Deserialize` on a config struct:
# 1.x moved `toml::Table` and `toml::Value` behind it, and reading each setting
# out of a parsed table by hand is the whole point of `config.rs`.
toml = { version = "1.1.4", default-features = false, features = [
	"parse",
	"serde",
] }
# Format-preserving edits: the app records the browser that worked back into
# config.toml, which is hand-edited and full of comments worth keeping.
toml_edit = "0.25.13"
# Cover art. `default-features = false` drops rayon: a 120px thumbnail decodes
# in well under a millisecond and does not want a thread pool, which would also
# be a second one alongside tokio's. The only image format needed is JPEG —
# YouTube's image CDN serves `…=w120-h120-l90-rj`, where `rj` *is* "return
# JPEG" — so the `image` crate and its format zoo buy nothing here.
jpeg-decoder = { version = "0.3.2", default-features = false }
thiserror = "2.0.20"
log = "0.4.33"
rand = "0.10.2"
dirs = "6.0.0"
inquire = "0.9.4"
# Same version as the `tui` binary's, so one hotpath is compiled rather than
# two side by side.
hotpath = "0.23.1"

# MPRIS2 — the desktop's media-player protocol. This is what makes the
# keyboard's media keys work and what lists the app as a player in GNOME/KDE.
# Linux-only by target, so Windows and macOS builds never see zbus at all.
# The "tokio" feature points zbus at the runtime the app already builds,
# instead of starting a second (async-io) reactor thread of its own.
[target.'cfg(target_os = "linux")'.dependencies]
mpris-server = { version = "0.10.0", features = ["tokio"] }

# The same feature on Windows: the System Media Transport Controls, which is
# both the media keys and the panel the volume flyout and the lock screen show.
# Namespace features only — no `Win32_UI_*`, because the SMTC here hangs off a
# `MediaPlayer` rather than an HWND (see `media/smtc.rs`). `Win32_System_Com` is
# for `CoInitializeEx` alone: WinRT calls need an apartment, and the thread that
# owns these objects is ours to initialise.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = [
	"Foundation",
	"Media",
	"Media_Playback",
	"Storage_Streams",
	"Win32_System_Com",
] }

# And on macOS: the Now Playing centre and the remote command centre, which is
# Control Centre, the media keys and a headset's play button. AppKit is here
# only to be an *app* — an accessory `NSApplication`, no window — since neither
# of the two answers a process the system does not think is one. Features are
# per-class in these crates, so each list is exactly what `media/nowplaying.rs`
# names; `objc2-app-kit` and `objc2-core-foundation` on the media-player crate
# are what turn on the `NSImage`/`CGSize` artwork initialiser.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
block2 = "0.6.2"
objc2-foundation = { version = "0.3.2", features = [
	"NSString",
	"NSDictionary",
	"NSValue",
	"NSData",
	"NSArray",
	"NSDate",
	"NSRunLoop",
] }
objc2-app-kit = { version = "0.3.2", features = [
	"NSApplication",
	"NSImage",
	"NSResponder",
	"NSRunningApplication",
] }
objc2-core-foundation = { version = "0.3.2", features = ["CFCGTypes"] }
objc2-media-player = { version = "0.3.2", features = [
	"MPNowPlayingInfoCenter",
	"MPRemoteCommandCenter",
	"MPRemoteCommand",
	"MPRemoteCommandEvent",
	"MPMediaItem",
	"MPRemoteControlTypes",
	"block2",
	"objc2-app-kit",
	"objc2-core-foundation",
] }

# `Media_Control` is the *reading* half of the same API — how a client
# enumerates what every app on the machine is publishing. Only the round-trip
# test needs it (it reads our own session back, the way the Linux one reads
# itself off D-Bus), so it goes here rather than in the dependency above and is
# never compiled into the shipped binary.
[target.'cfg(target_os = "windows")'.dev-dependencies]
windows = { version = "0.62.2", features = ["Media_Control"] }

[dev-dependencies]
# `macros` for #[tokio::test] in the live lyrics tests; `test-util` for the
# paused clock that keeps the retry-backoff tests instant.
tokio = { version = "1", features = [
	"rt",
	"rt-multi-thread",
	"macros",
	"time",
	"test-util",
] }

[build-dependencies]
pkg-config = "0.3.33"

# Profiling — zero overhead unless one of these is enabled.
# Forwarded through by the `tui` binary's identically-named features.
[features]
hotpath = ["hotpath/hotpath"]
hotpath-alloc = ["hotpath", "hotpath/hotpath-alloc"]
hotpath-cpu = ["hotpath", "hotpath/hotpath-cpu"]
