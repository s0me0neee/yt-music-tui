[package]
name = "ytm-core"
version = "0.1.0"
edition = "2024"

[dependencies]
ytmusicapi = "0.4.2"
libmpv2 = "6.0.0"
tokio = { version = "1", features = ["rt", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
log = "0.4"
rand = "0.8"
dirs = "5"
inquire = "0.9.4"
hotpath = "0.19.0"

[build-dependencies]
pkg-config = "0.3.33"

# Profiling — zero overhead unless one of these is enabled.
# Forwarded through by the `tui` binary's identically-named features.
[features]
hotpath = ["hotpath/hotpath"]
hotpath-alloc = ["hotpath", "hotpath/hotpath-alloc"]
hotpath-cpu = ["hotpath", "hotpath/hotpath-cpu"]
