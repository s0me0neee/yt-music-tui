[package]
name = "yt-music-tui"
version = "0.1.0"
edition = "2024"
#WARN:remove secret and clientid when puslished, and publish in a new repo to pervent history leak

[dependencies]
ratatui = "0.30.0"
anyhow = "1"
thiserror = "1"
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
dirs         = "5"
ytmusicapi = "0.4.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
log = "0.4"
simplelog = "0.12"
throbber-widgets-tui = "0.11.0"
rand = "0.8"
ctrlc = { version = "3", features = ["termination"] }
inquire = "0.9.4"
libmpv2 = "6.0.0"
hotpath = "0.19.0"

[build-dependencies]
pkg-config = "0.3.33"

# Profiling — zero overhead unless one of these is enabled.
#   cargo run --features hotpath            # wall-clock timing
#   cargo run --features hotpath,hotpath-alloc   # + allocations
[features]
hotpath = ["hotpath/hotpath"]
hotpath-alloc = ["hotpath", "hotpath/hotpath-alloc"]
hotpath-cpu = ["hotpath", "hotpath/hotpath-cpu"]
