[package]
name = "yt-music-tui"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/s0me0neee/yt-music-tui.git"

[[bin]]
name = "ytm"
path = "src/main.rs"

[dependencies]
ytm-core = { path = "../ytm-core" }
ratatui = "0.30.0"
# Already resolved in the graph via ratatui-core — used for cell-accurate
# truncation so wide (CJK/emoji) titles don't over-run their column.
unicode-width = "0.2"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
log = "0.4"
simplelog = "0.12"
throbber-widgets-tui = "0.11.0"
ctrlc = { version = "3", features = ["termination"] }
hotpath = "0.23.1"

# Profiling — zero overhead unless one of these is enabled.
#   cargo run --features hotpath            # wall-clock timing
#   cargo run --features hotpath,hotpath-alloc   # + allocations
#
# Each one turns the feature on in `ytm-core` as well as here. Without that the
# core's own `#[hotpath::measure]` attributes stay inert, and they are on the
# functions actually worth timing: the yt-dlp resolve, the playlist fetches,
# the cookie extraction. A profile of the TUI alone shows none of them.
[features]
hotpath = ["hotpath/hotpath", "ytm-core/hotpath"]
hotpath-alloc = ["hotpath", "hotpath/hotpath-alloc", "ytm-core/hotpath-alloc"]
hotpath-cpu = ["hotpath", "hotpath/hotpath-cpu", "ytm-core/hotpath-cpu"]
